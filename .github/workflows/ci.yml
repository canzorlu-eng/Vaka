name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaka
          POSTGRES_PASSWORD: vaka
          POSTGRES_DB: vaka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaka" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # tests/conftest.py and tests/billing_fixtures.py default to the dev compose port 55432: point them at the service.
      TEST_ADMIN_DSN: postgresql://vaka:vaka@localhost:5432/postgres
      TEST_DB_NAME: vaka_test                      # conftest creates this database through TEST_ADMIN_DSN
      TEST_DATABASE_URL: postgresql://vaka:vaka@localhost:5432/vaka_test
      BILLING_TEST_DATABASE_URL: postgresql://vaka:vaka@localhost:5432/vaka_billing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (advisory)
        run: ruff format --check . || echo "::warning::ruff format would change files (not enforced yet)"
      - name: Migrations apply cleanly on an empty database (alembic upgrade head)
        env:
          DATABASE_URL: postgresql://vaka:vaka@localhost:5432/vaka
        run: alembic upgrade head && alembic current
      - name: Prepare the billing test database
        env:
          PGPASSWORD: vaka
        run: |
          psql -h localhost -U vaka -d postgres -c 'CREATE DATABASE vaka_billing_test'
          DATABASE_URL="$BILLING_TEST_DATABASE_URL" alembic upgrade head
      - name: Tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: "Build (CI=true: warnings fail the build)"
        env:
          CI: "true"
          INLINE_RUNTIME_CHUNK: "false"
          GENERATE_SOURCEMAP: "false"
        run: npm run build
      - name: Dependency audit (runtime deps, high+; advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: vaka:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backup
          push: false
          tags: vaka-backup:ci
      - name: Smoke test the image (health + SPA)
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=vaka -e POSTGRES_PASSWORD=vaka -e POSTGRES_DB=vaka postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U vaka && break; sleep 2; done
          docker run -d --name app --network ci -p 10000:10000 \
            -e DATABASE_URL=postgresql://vaka:vaka@pg:5432/vaka -e SECRET_KEY="$(openssl rand -hex 24)" \
            -e APP_ENV=development -e AUTO_MIGRATE=true vaka:ci
          for i in $(seq 1 30); do curl -fsS localhost:10000/api/ready && break; sleep 2; done
          curl -fsS localhost:10000/api/health
          curl -fsS localhost:10000/ | grep -q '<div id="root">'
          # CSP is script-src 'self': an inline <script> in index.html would be blocked in browsers
          if curl -fsS localhost:10000/ | grep -E '<script>[^<]'; then echo 'inline script found'; exit 1; fi
      - name: Container logs on failure
        if: failure()
        run: docker logs app || true

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required status check for branch protection; also what Render's `autoDeployTrigger: checksPass` waits for.
  deploy-gate:
    name: deploy gate
    if: always()
    needs: [backend, frontend, docker, secret-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs must have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
