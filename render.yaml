# Lean Render Blueprint for the hackathon deployment (one web service + Postgres + Key Value).
# The full two-environment blueprint (production + staging + cron jobs) lives on `main`; this branch trades
# redundancy for a ~US$13/month footprint. Every secret is `sync: false`: typed into the Render dashboard once,
# never committed.
#
# Deploy: Dashboard -> New -> Blueprint -> pick this repo, branch `deploy/hackathon` -> fill the prompts.
# After the first deploy set PUBLIC_BASE_URL to the service URL and add
#   <PUBLIC_BASE_URL>/api/auth/google/callback
# to the Google OAuth client's "Authorized redirect URIs".

databases:
  - name: vaka-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: vaka
    user: vaka
    ipAllowList: []                     # internal connections only

services:
  - type: keyvalue
    name: vaka-redis
    region: frankfurt
    plan: free                          # cache + rate-limit counters only; nothing here is source of truth
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: vaka
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 1                     # in-process job workers: do not scale horizontally (docs/ARCHITECTURE.md)
    branch: deploy/hackathon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_GENERATION
        value: gemini-3.6-flash
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: OPENAI_TTS_VOICE
        value: coral
      - key: DATABASE_URL
        fromDatabase:
          name: vaka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vaka-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL            # https://<service>.onrender.com, no trailing slash
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
